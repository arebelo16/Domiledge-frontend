# HTTP - apenas para redirecionar e para Certbot challenges
server {
    listen 80;
    server_name staywise.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Web App + Backend
server {
    listen 443 ssl;
    server_name staywise.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/staywise.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staywise.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://staywise.duckdns.org:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
